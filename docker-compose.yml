services:
  postgres:
    image: postgres:16-alpine
    container_name: sarva-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarva
      POSTGRES_PASSWORD: sarva_secret
      POSTGRES_DB: sarva_shop
    ports:
      - "5432:5432"
    volumes:
      - sarva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarva -d sarva_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sarva_pgdata:
